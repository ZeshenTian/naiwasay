[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "naiwasay"
version = "0.1.0"
description = "A Naiwa ASCII-art speaker with the Python cowsay API and CLI."
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Zeshen Tian"}]
keywords = ["naiwa", "cowsay", "ascii-art", "terminal", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
    "Topic :: Terminals",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ZeshenTian/naiwasay"
Source = "https://github.com/ZeshenTian/naiwasay"
Issues = "https://github.com/ZeshenTian/naiwasay/issues"

[project.scripts]
naiwasay = "naiwasay.__main__:cli"

[tool.setuptools.packages.find]
where = ["src"]


