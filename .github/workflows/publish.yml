name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  build:
    name: Test and build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install package and build tools
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install .
      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          from importlib.metadata import version

          tag = os.environ["RELEASE_TAG"]
          package_version = version("naiwasay")
          if tag not in (package_version, "v" + package_version):
              raise SystemExit(
                  f"Release tag {tag!r} must be {package_version!r} "
                  f"or {'v' + package_version!r}"
              )
          PY
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test installed command
        run: naiwasay -t "奶家人，我来了！" -c naiwa
      - name: Build wheel and source distribution
        run: python -m build
      - name: Check distribution metadata and README
        run: python -m twine check --strict dist/*
      - name: Store checked distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish checked distributions
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/naiwasay/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download checked distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist/
      - name: Publish to PyPI using trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1, v1.14.3
        with:
          packages-dir: dist/
